<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A to Z</title>
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
  :root{
    --bg:#eef0f3; --text:#111111; --hint:#8a8a8a; --sec:#ffffff;
    --border:#e6e6eb; --btn:#2481cc; --btn-text:#ffffff; --accent:#2481cc;
    --brand:#0b7a4b; --brand2:#0e9f63; --gold:#f2b705;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans Devanagari","Noto Sans Myanmar",sans-serif;background:var(--bg);color:var(--text);padding:16px 16px 110px}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #view-home,#view-rate,#view-lang,#view-tr{animation:fadeIn .25s ease}
  .profile{display:flex;align-items:center;gap:12px;margin:4px 0 20px}
  .avatar{flex:0 0 52px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;box-shadow:0 2px 8px rgba(11,122,75,.3)}
  .pname{font-size:19px;font-weight:800}
  .pstatus{font-size:13px;color:var(--hint);margin-top:2px}
  .pstatus .dot{color:#22c55e}
  .actions{display:flex;justify-content:space-around;margin-bottom:20px}
  .act{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0}
  .act .circ{width:64px;height:64px;border-radius:50%;background:var(--sec);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .act .lbl{font-size:14px;font-weight:600;color:var(--text)}
  .act:active .circ{transform:scale(.94)}
  .sec-head{font-size:13px;letter-spacing:.5px;color:var(--hint);text-transform:uppercase;margin:18px 0 8px;display:flex;justify-content:space-between}
  .back-btn{border:none;background:none;color:var(--accent);font-size:16px;cursor:pointer;padding:6px 0 10px}
  .lang-list button{display:block;width:100%;padding:14px;margin-bottom:8px;font-size:16px;border:1px solid var(--border);border-radius:12px;background:var(--sec);color:var(--text);cursor:pointer;text-align:left}
  .lang-list button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:var(--brand);color:#fff}
  .card{background:var(--sec);border-radius:18px;padding:6px 14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  label{display:block;font-size:13px;color:var(--hint);margin-bottom:4px}
  input[type=number]{width:100%;font-size:22px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);margin-bottom:12px}
  textarea{width:100%;min-height:90px;font-size:16px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);margin-bottom:12px;font-family:inherit;resize:vertical}
  .row{display:flex;gap:8px;align-items:flex-end}
  .col{flex:1;min-width:0}
  select{width:100%;font-size:16px;padding:10px 8px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
  #swap{flex:0 0 44px;height:44px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:20px;cursor:pointer;margin-bottom:2px}
  .chips{display:flex;gap:8px;margin:12px 0 4px}
  .chips button{flex:1;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;padding:7px 0;font-size:14px;cursor:pointer}
  .result{font-size:22px;font-weight:700;margin-top:12px;word-break:break-word;background:rgba(11,122,75,.08);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px}
  .unit{font-size:14px;color:var(--hint);margin-top:8px}
  .list-row{display:flex;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--border);cursor:pointer}
  .list-row:last-child{border-bottom:none}
  .list-row .nm{font-size:15px}
  .list-row .vl{font-size:15px;font-weight:700;white-space:nowrap}
  .hint{font-size:13px;color:var(--hint);margin-top:10px}
  .updated{font-size:13px;color:var(--hint);text-align:center;margin-top:16px}
  #refresh, #trButton{display:block;width:100%;margin-top:10px;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  #refresh:active, #trButton:active{opacity:.85}
  .err{color:#c0392b;font-size:14px;margin-top:10px}
  .src{font-size:12px;color:var(--hint);text-align:center;margin-top:14px}
  .foot{font-size:12px;color:var(--hint);text-align:center;margin-top:6px}
  .bottom-nav{position:fixed;left:12px;right:12px;bottom:12px;background:var(--sec);border-radius:26px;box-shadow:0 6px 24px rgba(0,0,0,.16);display:flex;justify-content:space-around;padding:8px 4px;z-index:10}
  .nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--hint);padding:4px 10px}
  .nav-btn .ic{font-size:22px}
  .nav-btn.on{color:var(--brand);font-weight:700}
  .menu-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--border);cursor:pointer}
  .menu-row:last-child{border-bottom:none}
  .menu-ic{flex:0 0 44px;width:44px;height:44px;border-radius:12px;background:rgba(11,122,75,.08);display:flex;align-items:center;justify-content:center;font-size:24px}
  .menu-tx{flex:1;min-width:0}
  .menu-ti{font-size:16px;font-weight:700}
  .menu-sub{font-size:13px;color:var(--hint);margin-top:2px}
  .chev{color:var(--hint);font-size:18px}
  input[type=text]{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);margin-bottom:12px}
  .month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .month-nav button{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;width:36px;height:36px;font-size:18px;cursor:pointer}
  .month-nav span{font-size:16px;font-weight:700}
  .led-totals{display:flex;gap:8px;margin-bottom:14px}
  .led-box{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center}
  .led-lbl{font-size:12px;color:var(--hint)}
  .led-val{font-size:16px;font-weight:800;margin-top:2px;word-break:break-word}
  .led-val.in{color:#0b7a4b}.led-val.out{color:#c0392b}
  .led-row{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--border);align-items:center}
  .led-row:last-child{border-bottom:none}
  .led-t{font-size:15px}.led-d{font-size:12px;color:var(--hint)}
  .led-a{font-size:15px;font-weight:700;white-space:nowrap}
  .led-a.in{color:#0b7a4b}.led-a.out{color:#c0392b}
  .led-del{border:none;background:none;color:#c0392b;font-size:13px;cursor:pointer;padding:4px}
  .calc-display{background:var(--bg);border-radius:10px;padding:12px;text-align:right;min-height:64px;margin-bottom:10px;word-break:break-all}
  #calcExpr{font-size:18px;color:var(--hint);min-height:22px}
  #calcRes{font-size:26px;font-weight:800}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .calc-btn{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:13px 0;font-size:18px;cursor:pointer}
  .calc-btn.op{background:rgba(11,122,75,.12);font-weight:700}
  .calc-btn.eq{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;font-weight:800}
  .calc-btn:active{opacity:.8}
  #calcSciBtn{width:100%;padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;cursor:pointer}
  .tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
  .tab{flex:1;border:1px solid var(--border);background:var(--sec);color:var(--text);border-radius:20px;padding:8px 4px;font-size:14px;cursor:pointer;white-space:nowrap}
  .tab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:var(--brand)}
  .news-item{display:block;padding:12px 2px;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text)}
  .news-item:last-child{border-bottom:none}
  .news-ti{font-size:15px;font-weight:600;line-height:1.35}
  .news-meta{font-size:12px;color:var(--hint);margin-top:4px}
  .tour-row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--border);cursor:pointer}
  .tour-row:last-child{border-bottom:none}
  .tour-nm{font-size:16px;font-weight:700}
  .tour-sub{font-size:13px;color:var(--hint);margin-top:2px}
  .tour-place{padding:11px 2px;border-bottom:1px solid var(--border)}
  .tour-place:last-child{border-bottom:none}
  .tour-pn{font-size:15px;font-weight:700}
  .tour-pd{font-size:13px;color:var(--hint);margin-top:3px;line-height:1.4}
</style>
</head>
<body>
  <div class="profile">
    <div class="avatar">$</div>
    <div>
      <div class="pname" id="userName">Dollar Rate</div>
      <div class="pstatus"><span class="dot">●</span> <span id="userStatus">Live</span></div>
    </div>
  </div>

  <div id="view-home">
    <div class="sec-head"><span id="menuHead"></span></div>
    <div class="card" id="menuList"></div>
    <div class="sec-head"><span id="popularTitle"></span><span id="popularCount"></span></div>
    <div class="card"><div id="list"></div></div>
    <div class="hint" id="tapHint"></div>
    <div class="updated" id="updated"></div>
  </div>

  <div id="view-rate" style="display:none">
    <button class="back-btn" id="backRate"></button>
    <div class="card">
      <label id="lblAmount" for="amount">পরিমাণ</label>
      <input id="amount" type="number" inputmode="decimal" min="0" step="any" value="1">
      <div class="row">
        <div class="col">
          <label id="lblFrom" for="fromSel">থেকে</label>
          <select id="fromSel"></select>
        </div>
        <button id="swap" title="swap">⇅</button>
        <div class="col">
          <label id="lblTo" for="toSel">এতে</label>
          <select id="toSel"></select>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="result" id="result">…</div>
      <div class="unit" id="unit"></div>
      <div class="err" id="err" style="display:none"></div>
    </div>
    <button id="refresh"></button>
  </div>

  <div id="view-lang" style="display:none">
    <button class="back-btn" id="backLang"></button>
    <div class="lang-list" id="langList"></div>
  </div>

  <div id="view-tr" style="display:none">
    <button class="back-btn" id="backTr"></button>
    <div class="card">
      <label id="lblTrInput" for="trInput">লেখা</label>
      <textarea id="trInput" rows="4"></textarea>
      <label id="lblTrTo" for="trToSel">কোন ভাষায়</label>
      <select id="trToSel"></select>
      <button id="trButton"></button>
      <div class="result" id="trResult"></div>
      <div class="unit" id="trUnit"></div>
    </div>
  </div>

  <div id="view-ledger" style="display:none">
    <button class="back-btn" id="backLedger"></button>
    <div class="card">
      <div class="month-nav"><button id="ledPrev">‹</button><span id="ledMonth"></span><button id="ledNext">›</button></div>
      <div class="led-totals">
        <div class="led-box"><div class="led-lbl" id="lblLedIn"></div><div class="led-val in" id="ledIn">0</div></div>
        <div class="led-box"><div class="led-lbl" id="lblLedOut"></div><div class="led-val out" id="ledOut">0</div></div>
        <div class="led-box"><div class="led-lbl" id="lblLedBal"></div><div class="led-val" id="ledBal">0</div></div>
      </div>
      <label id="lblLedWhat" for="ledWhat"></label>
      <input id="ledWhat" type="text" maxlength="40">
      <label id="lblLedAmt" for="ledAmt"></label>
      <input id="ledAmt" type="number" inputmode="decimal" min="0" step="any">
      <div class="row"><div class="col"><select id="ledType"></select></div></div>
      <button id="ledAdd"></button>
      <div class="err" id="ledErr" style="display:none"></div>
    </div>
    <div class="sec-head"><span id="ledListHead"></span></div>
    <div class="card"><div id="ledList"></div></div>
  </div>

  <div id="view-calc" style="display:none">
    <button class="back-btn" id="backCalc"></button>
    <div class="card">
      <div class="calc-display"><div id="calcExpr"></div><div id="calcRes">=</div></div>
      <button id="calcSciBtn"></button>
      <div class="calc-grid" id="calcSci" style="display:none"></div>
      <div class="calc-grid" id="calcMain"></div>
    </div>
  </div>

  <div id="view-tour" style="display:none">
    <button class="back-btn" id="backTour"></button>
    <div class="card"><div id="tourList"></div></div>
  </div>

  <div id="view-news" style="display:none">
    <button class="back-btn" id="backNews"></button>
    <div class="tabs" id="newsTabs"></div>
    <div class="card"><div id="newsList"></div></div>
    <div class="hint" id="newsHint"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn on" id="navHome"><span class="ic">🏠</span><span id="lblNavHome">Home</span></button>
    <button class="nav-btn" id="navRate"><span class="ic">💵</span><span id="lblNavRate"></span></button>
    <button class="nav-btn" id="navLang"><span class="ic">🌐</span><span id="lblNavLang"></span></button>
    <button class="nav-btn" id="navTr"><span class="ic">🔤</span><span id="lblNavTr"></span></button>
  </nav>

  <div class="src" id="src"></div>
  <div class="foot" id="foot"></div>

  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone:"Asia/Dhaka", day:"numeric", month:"numeric", year:"numeric",
    hour:"numeric", minute:"2-digit", hour12:true
  }).formatToParts(d);
  const get = type => (parts.find(p => p.type === type) || {}).value || "";
  const months = MONTHS[lang] || MONTHS.bn;
  const day = locDigits(get("day")), year = locDigits(get("year"));
  const monthName = months[parseInt(get("month"), 10) - 1] || get("month");
  const hm = locDigits(get("hour") + ":" + get("minute") + " " + get("dayPeriod"));
  return day + " " + monthName + " " + year + ", " + hm;
}

function convert(amount, from, to){
  if(from === to) return amount;
  const rFrom = from === "USD" ? 1 : rates[from];
  const rTo = to === "USD" ? 1 : rates[to];
  if(!rFrom || !rTo) return null;
  return amount / rFrom * rTo;
}

async function fetchRates(force){
  const now = Date.now();
  if(rates && !force && now - ratesAt < 30 * 60 * 1000) return;
  const urls = [
    "https://open.er-api.com/v6/latest/USD",
    "https://api.exchangerate-api.com/v4/latest/USD"
  ];
  let lastErr = "";
  for(const url of urls){
    try{
      const resp = await fetch(url, {headers: {"Accept": "application/json"}});
      const data = await resp.json();
      if(!data.rates || !data.rates.BDT) throw new Error("bad payload");
      rates = data.rates;
      ratesAt = Date.now();
      updatedUtc = data.time_last_update_utc || data.date || "";
      $("err").style.display = "none";
      renderResult(); renderList();
      return;
    }catch(e){ lastErr = String(e && e.message || e); }
  }
  const err = $("err");
  err.style.display = "block";
  err.textContent = t("error").replace("{e}", lastErr);
  $("updated").textContent = t("error").replace("{e}", lastErr);
}

function csGet(key, cb){
  if(tg && tg.CloudStorage && tg.CloudStorage.getItem){
    try{ tg.CloudStorage.getItem(key, function(err, val){ cb(val || ""); }); }
    catch(e){ cb(""); }
  } else {
    try{ cb(localStorage.getItem(key) || ""); }catch(e){ cb(""); }
  }
}
function csSet(key, val, cb){
  if(tg && tg.CloudStorage && tg.CloudStorage.setItem){
    try{ tg.CloudStorage.setItem(key, val, function(err){ if(cb) cb(!err); }); }
    catch(e){ if(cb) cb(false); }
  } else {
    try{ localStorage.setItem(key, val); if(cb) cb(true); }catch(e){ if(cb) cb(false); }
  }
}
function ledMonthLabel(){
  const parts = ledMonth.split("-");
  const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
  const months = MONTHS[lang] || MONTHS.bn;
  return (months[m - 1] || m) + " " + locDigits(y);
}
function ledShift(dir){
  const parts = ledMonth.split("-");
  let y = parseInt(parts[0], 10), m = parseInt(parts[1], 10) + dir;
  if(m < 1){ m = 12; y -= 1; }
  if(m > 12){ m = 1; y += 1; }
  ledMonth = y + "-" + String(m).padStart(2, "0");
  ledLoad();
}
function ledLoad(){
  csGet("ledger_" + ledMonth, function(val){
    try{ ledEntries = val ? JSON.parse(val) : []; }

// ---- Calculator (normal + scientific) ----
function fact(n){
  n = Math.floor(n);
  if(n < 0 || n > 170) throw new Error("fact");
  let r = 1;
  for(let i = 2; i <= n; i++) r *= i;
  return r;
}
function calcEval(expr){
  let e = expr.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-")
              .replace(/%/g, "/100").replace(/π/g, "Math.PI")
              .replace(/√\(/g, "Math.sqrt(").replace(/√/g, "Math.sqrt")
              .replace(/sin\(/g, "Math.sin(").replace(/cos\(/g, "Math.cos(")
              .replace(/tan\(/g, "Math.tan(").replace(/log\(/g, "Math.log10(")
              .replace(/ln\(/g, "Math.log(").replace(/\^/g, "**")
              .replace(/(\d+)!/g, "fact($1)")
              .replace(/e/g, "Math.E");
  const check = e.replace(/Math\.(PI|E|sqrt|sin|cos|tan|log10|log)/g, "").replace(/fact/g, "");
  if(!/^[0-9+\-*/().\s]*$/.test(check)) throw new Error("bad");
  const v = Function('"use strict"; return (' + e + ')')();
  if(typeof v !== "number" || !isFinite(v)) throw new Error("bad");
  return v;
}
function calcShow(){
  $("calcExpr").textContent = calcExpr || " ";
  let res = "=";
  if(calcExpr){
    try{ res = "= " + fmt(calcEval(calcExpr)); }
    catch(e){ res = "= " + t("calc_err"); }
  }
  $("calcRes").textContent = res;
}
function calcPress(key){
  if(key === "C"){ calcExpr = ""; }
  else if(key === "⌫"){ calcExpr = calcExpr.slice(0, -1); }
  else if(key === "="){
    try{ calcExpr = String(calcEval(calcExpr)); }catch(e){ calcExpr = ""; }
  }
  else if(key === "±"){ calcExpr = calcExpr.startsWith("−") ? calcExpr.slice(1) : "−" + calcExpr; }
  else if(key === "x²"){ calcExpr += "^2"; }
  else if(key === "x^y"){ calcExpr += "^"; }
  else if(key === "1/x"){ if(calcExpr) calcExpr = "1/(" + calcExpr + ")"; }
  else if(key === "√"){ calcExpr += "√("; }
  else if(key === "sin" || key === "cos" || key === "tan" || key === "log" || key === "ln"){ calcExpr += key + "("; }
  else { calcExpr += key; }
  calcShow();
}
function buildCalc(){
  const main = ["C", "⌫", "%", "÷", "7", "8", "9", "×", "4", "5", "6", "−", "1", "2", "3", "+", "±", "0", ".", "="];
  const sci = ["sin", "cos", "tan", "log", "ln", "√", "x²", "x^y", "π", "e", "(", ")", "!", "1/x"];
  const mk = (grid, keys) => {
    grid.innerHTML = "";
    keys.forEach(k => {
      const b = document.createElement("button");
      b.className = "calc-btn" + (["÷", "×", "−", "+", "%"].includes(k) ? " op" : "") + (k === "=" ? " eq" : "");
      b.textContent = k;
      b.onclick = () => calcPress(k);
      grid.appendChild(b);
    });
  };
  mk($("calcMain"), main);
  mk($("calcSci"), sci);
  $("calcSciBtn").textContent = "ƒx " + t("calc_sci");
  calcShow();
}

const NEWS_SRC = {
  crypto: [
    {type: "api", url: "https://cryptocurrency.cv/api/news?limit=10"},
    {type: "rss", url: "https://www.coindesk.com/arc/outboundfeeds/rss/"}
  ],
  world: [
    {type: "rss", url: "http://feeds.bbci.co.uk/news/world/rss.xml"}
  ],
  travel: [
    {type: "rss", url: "https://news.google.com/rss/search?q=tourism&hl=en&gl=US&ceid=US:en"}
  ],
  social: [
    {type: "rss", url: "https://news.google.com/rss/search?q=social%20media&hl=en&gl=US&ceid=US:en"}
  ]
};
function parseApiNews(data){
  const arr = Array.isArray(data) ? data : (data.data || data.news || data.items || data.articles || []);
  if(!Array.isArray(arr)) return [];
  return arr.map(it => ({
    title: it.title || it.headline || "",
    link: it.url || it.link || "",
    src: (it.source && (it.source.name || it.source)) || it.publisher || "",
    date: it.published_at || it.pubDate || it.date || it.timestamp || ""
  })).filter(x => x.title);
}
async function fetchRss(url){
  const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url));
  const j = await r.json();
  if(j.status !== "ok" || !Array.isArray(j.items)) throw new Error("rss");
  return j.items.map(it => ({
    title: (it.title || "").replace(/<[^>]*>/g, ""),
    link: it.link || "",
    src: it.author || "",
    date: it.pubDate || ""
  })).filter(x => x.title);
}
function buildNewsTabs(){
  const tabs = $("newsTabs"); tabs.innerHTML = "";
  [["crypto", t("tab_crypto")], ["world", t("tab_world")], ["travel", t("tab_travel")], ["social", t("tab_social")]].forEach(([k, l]) => {
    const b = document.createElement("button");
    b.className = "tab" + (k === newsTab ? " on" : "");
    b.textContent = l;
    b.onclick = () => loadNews(k);
    tabs.appendChild(b);
  });
}
async function loadNews(tab){
  newsTab = tab;
  buildNewsTabs();
  const list = $("newsList");
  if(newsCache[tab]){ renderNews(newsCache[tab]); return; }
  list.innerHTML = "";
  const d = document.createElement("div");
  d.className = "hint"; d.textContent = t("loading");
  list.appendChild(d);
  let items = [];
  for(const src of NEWS_SRC[tab]){
    try{
      if(src.type === "api"){
        const r = await fetch(src.url, {headers: {"Accept": "application/json"}});
        items = parseApiNews(await r.json());
      } else {
        items = await fetchRss(src.url);
      }
      if(items.length) break;
    }catch(e){ items = []; }
  }
  items = items.slice(0, 10);
  newsCache[tab] = items;
  renderNews(items);
}
function renderNews(items){
  const list = $("newsList"); list.innerHTML = "";
  if(!items.length){
    const d = document.createElement("div");
    d.className = "hint"; d.textContent = t("news_error");
    list.appendChild(d);
    return;
  }
  items.forEach(it => {
    const a = document.createElement("a");
    a.className = "news-item";
    a.href = it.link || "#";
    a.target = "_blank";
    const ti = document.createElement("div");
    ti.className = "news-ti"; ti.textContent = it.title;
    const meta = document.createElement("div");
    meta.className = "news-meta";
    let m = it.src || "";
    if(it.date){
      const dd = new Date(it.date);
      if(!isNaN(dd)) m += (m ? " • " : "") + formatDhaka(dd.toISOString()).split(",")[0];
    }
    meta.textContent = m;
    a.appendChild(ti); a.appendChild(meta);
    list.appendChild(a);
  });
}

function waitForTelegram(tries){
  // telegram-web-app.js loads async: it may arrive after init(). Poll for
  // it briefly so theme + user name still apply; the page works without it.
  if(window.Telegram && window.Telegram.WebApp){
    tg = window.Telegram.WebApp;
    applyTheme();
    tg.ready();
    tg.expand();
    tg.onEvent("themeChanged", applyTheme);
    if(tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name){
      $("userName").textContent = tg.initDataUnsafe.user.first_name;
    }
    return;
  }
  if(tries > 0) setTimeout(() => waitForTelegram(tries - 1), 250);
}

  // language: Telegram user's language first, else Bangla
  let lc = "";
  if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user){
    lc = (tg.initDataUnsafe.user.language_code || "").slice(0, 2).toLowerCase();
  }
  if(LANGS.includes(lc)) lang = lc;

  applyTheme();
  if(tg){
    tg.ready();
    tg.expand();
    tg.onEvent("themeChanged", applyTheme);
  } else {
    waitForTelegram(20);
  }
  buildSelects();
  const now = new Date();
  ledMonth = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  buildCalc();
  $("amount").addEventListener("input", renderResult);
  $("fromSel").addEventListener("change", e => { fromCode = e.target.value; renderResult(); });
  $("toSel").addEventListener("change", e => { toCode = e.target.value; renderResult(); });
  $("swap").addEventListener("click", () => {
    const tmp = fromCode; fromCode = toCode; toCode = tmp;
    buildSelects(); renderResult();
  });
  $("refresh").addEventListener("click", () => fetchRates(true));
  $("navHome").addEventListener("click", () => showView("home"));
  $("navRate").addEventListener("click", () => showView("rate"));
  $("navLang").addEventListener("click", () => showView("lang"));
  $("navTr").addEventListener("click", () => showView("tr"));
  $("backRate").addEventListener("click", () => showView("home"));
  $("backLang").addEventListener("click", () => showView("home"));
  $("backTr").addEventListener("click", () => showView("home"));
  $("backLedger").addEventListener("click", () => showView("home"));
  $("backCalc").addEventListener("click", () => showView("home"));
  $("backNews").addEventListener("click", () => showView("home"));
  $("backTour").addEventListener("click", () => {
    if(tourCountry !== null){ tourCountry = null; renderTour(); }
    else showView("home");
  });
  $("ledPrev").addEventListener("click", () => ledShift(-1));
  $("ledNext").addEventListener("click", () => ledShift(1));
  $("ledAdd").addEventListener("click", ledAddEntry);
  $("calcSciBtn").addEventListener("click", () => {
    calcSciOn = !calcSciOn;
    $("calcSci").style.display = calcSciOn ? "grid" : "none";
  });
  $("trButton").addEventListener("click", doTranslate);
  $("trToSel").addEventListener("change", e => { trTo = e.target.value; });
  trTo = (lang === "en") ? "bn" : "en";
  render();
  showView("home");
  fetchRates(false);
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
